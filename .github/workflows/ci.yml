# Tests every push and pull request; publishes the site to GitHub Pages from main:
# the app with its example, the help, the page « Créer l'archive » and the kit.
# No secret is used: everything published is in this repository.
#
# One-time setup on github.com: Settings -> Pages -> Source: "GitHub Actions". Until then the
# site is built and tested, and the deployment is skipped with a notice.
#
# Nothing runs for a change to the Markdown files at the root only. docs/ does count:
# docs/CREER.md is rendered into the site (creer.html) and the documents are in the kit.
name: Pages
on:
  push:
    branches: [main]
    paths-ignore: ['*.md']
  pull_request:
    paths-ignore: ['*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # the pipeline and the tools (pytest): the builder, the archive checker, the transcription
  # format, the page tools, works of every shape
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt
      - run: pip install -r pipeline/requirements-dev.txt
      - run: python -m pytest pipeline/tests -q

  # the site: the example built by the pipeline, the kit, the app's unit tests, the build, and the
  # end-to-end tests on that very build (Chromium): what is deployed is what was tested
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: The example work, checked (-> app/public/packs)
        run: python pipeline/publish.py
      - name: The kit (-> app/public/kit.zip)
        run: python tools/make_kit.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      # what « Version » will show in the track list (fails if the page does not carry it)
      - name: Version built
        run: grep -o 'name="pupitre-version" content="[^"]*"' app/dist/index.html
      # the browser as Playwright downloaded it, kept for the next runs (until the dependencies
      # change). `--only-shell`: the tests run headless, the full browser is never started
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('app/package-lock.json') }}
      - run: npx playwright install --only-shell chromium
        working-directory: app
      - run: npm run e2e
        working-directory: app
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      # the tests' own archives are not part of the site
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, pipeline-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages not set up yet (see the top of this file): say so instead of failing
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -qx workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Site not deployed::GitHub Pages is not set up for this repository: Settings -> Pages -> Source: GitHub Actions, then run this workflow again."
          fi
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
