# Œuvre d'exemple de Pupitre Ouvert, et modèle d'un dossier d'œuvre complet :
# work.yaml + un MusicXML par mouvement + pages/ (images et pages.json) + fiche.md (facultative).
# Fabrication de l'archive : python pipeline/publish.py deux-chorals  ->  packs/deux-chorals.zip
id: bach-deux-chorals
title: "Deux chorals"
composer: "J. S. Bach"
notice: "Chorals BWV 140/7 et 244/54 (corpus music21, domaine public). Pages gravées par Verovio. Œuvre d'exemple."
defaultPart: S
movements:
  - {file: choral1.musicxml, id: choral1, title: "1. Wachet auf, ruft uns die Stimme"}
  - {file: choral2.musicxml, id: choral2, title: "2. O Haupt voll Blut und Wunden"}
lyrics:
  1: {id: de, label: "Allemand", lang: de}
